<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habesha Eatery - Menu Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <article class="menu-card">
    <div class="card-header">
      <h3 class="item-name">Special Doro Wat</h3>
      <span class="price">650</span>
    </div>
    <p class="item-description">
      Slow-cooked chicken stew infused with berbere spice, spiced butter (niter kibbeh), and hard-boiled egg.
    </p>
    <ul class="ingredients">
      <li>Slow-cooked Tender Chicken</li>
      <li>Authentic Berbere Spice Blend</li>
      <li>House Niter Kibbeh (Spiced Butter)</li>
      <li>Hard-boiled Farm Egg</li>
      <li>Fresh Sourdough Injera</li>
    </ul>
  </article>

</body>
</html>
