<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birr Watch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="converter">
  <h1>Birr Watch</h1>
  <p id="status"></p>

  <form class="frm" id="convert-form">
    <input id="amount" type="number" value="100" step="any" required />
    <select id="currency"></select>
    <button class="btn btn-primary" type="submit"> Convert </button><br><br>
    <button class="btn btn-secondary" type="button" id="watch">Add to Watchlist</button>
  </form>

  <p id="result"></p>

  <h2>Watchlist</h2>
  <ul id="watchlist"></ul>
    </main>
  <script src="app.js"></script>
</body>
</html>
