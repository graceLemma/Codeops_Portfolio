<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sign Up Form</h1>
    <form action="" class="form" id="signup-form">
        <label for="username">Username:</label>
        <input type="text" id="username" class="input" placeholder="username is required" required><br>
        <label for="password">Password:</label>
        <input type="password" id="password" class="input" placeholder="password is required" required><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" class="input" placeholder="phone number is required" required><br>
        <br> <button class="btn">Submit</button>
    </form>
    <p id="totalppl"> Total People Signed UP </p>
    
    <script src="js/script.js"></script>
</body>
</html>
