<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Facts Page</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>

  <main class="card">
    <h1>Country Facts</h1>

    <form id="search-form" class="search-box">
      <input 
        type="text" 
        id="country-input" 
        placeholder="Enter country..." 
        value="ethiopia" 
        required 
      />
      <button type="submit">Search</button>
    </form>
    <div id="facts" class="facts-container"></div>
  </main>

  <script src="js/project.js"></script>
</body>
</html>
